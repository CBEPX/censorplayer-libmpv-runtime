name: Gate 0 candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate0:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET: x86_64-w64-mingw32
      RUST_TARGET: x86_64-pc-windows-gnu
    steps:
      - name: Check out runtime recipe
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check out exact mpv source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: mpv-player/mpv
          ref: 85bf9f4ff46cd45686cfe2fd22f49828877db5cb
          path: upstream
          persist-credentials: false

      - name: Replace only FFmpeg checkout with exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: FFmpeg/FFmpeg
          ref: 272c273d30f737632e6630458ed36a0bdbfbc3fc
          path: upstream/ffmpeg
          persist-credentials: false

      - name: Check out exact nv-codec-headers source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: FFmpeg/nv-codec-headers
          ref: 876af32a202d0de83bd1d36fe74ee0f7fcf86b0d
          path: upstream/nv-codec-headers
          persist-credentials: false

      - name: Install upstream MinGW build dependencies
        run: |
          rustup target add "$RUST_TARGET"
          sudo dpkg --add-architecture i386
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ccache g++-mingw-w64 gcc-multilib nasm ninja-build pkgconf wine64 wine
          python3 -m pip install meson
          mkdir -p "$RUNNER_TEMP/gate0-toolchain-source"
          cd "$RUNNER_TEMP/gate0-toolchain-source" || exit 1
          apt-get source gcc-mingw-w64-x86-64 mingw-w64
          dpkg-query -W 'gcc-mingw-w64*' 'g++-mingw-w64*' 'mingw-w64*' \
            > INSTALLED-PACKAGES.txt

      - name: Install upstream Meson wraps
        working-directory: upstream
        run: |
          mkdir -p subprojects
          meson wrap install mujs
          meson subprojects download

      - name: Prefetch verified upstream archives
        working-directory: upstream
        run: |
          set -euo pipefail
          prefetch_archive() {
            local task_archive=$1
            local task_size=$2
            local task_sha256=$3
            local task_url=$4
            curl --fail --show-error --silent --location \
              --retry 5 --retry-all-errors --connect-timeout 20 \
              --output "$task_archive" "$task_url"
            test "$(wc -c < "$task_archive")" -eq "$task_size"
            printf '%s  %s\n' "$task_sha256" "$task_archive" \
              | sha256sum --check --strict
          }
          while read -r task_archive task_size task_sha256 task_url; do
            prefetch_archive "$task_archive" "$task_size" "$task_sha256" "$task_url"
          done <<'EOF'
          libiconv-1.18.tar.gz 5822590 3b08f5f4f9b4eb82f151a7040bfd6fe6c6fb922efe4b1659c66ea933276965e8 https://ftp.gnu.org/gnu/libiconv/libiconv-1.18.tar.gz
          zlib-1.3.1.tar.gz 1512791 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23 https://zlib.net/fossils/zlib-1.3.1.tar.gz
          AMF-headers-v1.5.0.tar.gz 82755 d569647fa26f289affe81a206259fa92f819d06db1e80cc334559953e82a3f01 https://github.com/GPUOpen-LibrariesAndSDKs/AMF/releases/download/v1.5.0/AMF-headers-v1.5.0.tar.gz
          freetype-2.14.1.tar.xz 2664948 32427e8c471ac095853212a37aef816c60b42052d4d9e48230bab3bdf2936ccc https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.xz
          fribidi-1.0.16.tar.xz 1098260 1b1cde5b235d40479e91be2f0e88a309e3214c8ab470ec8a2744d82a5a9ea05c https://github.com/fribidi/fribidi/releases/download/v1.0.16/fribidi-1.0.16.tar.xz
          harfbuzz-12.2.0.tar.xz 18221900 ecb603aa426a8b24665718667bda64a84c1504db7454ee4cadbd362eea64e545 https://github.com/harfbuzz/harfbuzz/releases/download/12.2.0/harfbuzz-12.2.0.tar.xz
          EOF

      - name: Build upstream dependency set
        working-directory: upstream
        run: ./ci/build-mingw64.sh

      - name: Build upstream mpv and package its dependencies
        working-directory: upstream
        run: ./ci/build-mingw64.sh meson pack

      - name: Prove libmpv output exists
        run: test -f upstream/mingw_build/libmpv-2.dll

      - name: Package and verify recursive runtime closure
        run: |
          set -euo pipefail
          task_runtime_roots=(upstream/mingw_prefix/bin)
          for task_dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            task_path=$(x86_64-w64-mingw32-gcc-posix -print-file-name="$task_dll")
            test -f "$task_path"
            task_runtime_roots+=("$(dirname "$task_path")")
          done
          task_probe_dir="$RUNNER_TEMP/gate0-api-probe"
          mkdir -p "$task_probe_dir"
          cp upstream/mingw_build/libmpv-2.dll "$task_probe_dir/"
          for task_root in "${task_runtime_roots[@]}"; do
            find "$task_root" -maxdepth 1 -type f -iname '*.dll' \
              -exec cp -f {} "$task_probe_dir/" \;
          done
          x86_64-w64-mingw32-gcc-posix \
            -Iupstream/include \
            -Lupstream/mingw_build \
            -o "$task_probe_dir/libmpv-api-version.exe" \
            -x c - -lmpv <<'EOF'
          #include <stdio.h>
          #include <mpv/client.h>

          int main(void) {
              printf("%lu\n", mpv_client_api_version());
              return 0;
          }
          EOF
          task_api_version=$(
            cd "$task_probe_dir" || exit 1
            WINEDEBUG=-all wine ./libmpv-api-version.exe | tr -d '\r'
          )
          [[ "$task_api_version" =~ ^[0-9]+$ ]]
          (( (task_api_version >> 16) == 2 ))
          task_search_args=()
          for task_root in "${task_runtime_roots[@]}"; do
            task_search_args+=(--search-root "$task_root")
          done
          python3 scripts/package_candidate.py \
            --libmpv upstream/mingw_build/libmpv-2.dll \
            "${task_search_args[@]}" \
            --output gate0-candidate \
            --objdump x86_64-w64-mingw32-objdump \
            --api-version "$task_api_version"
          python3 scripts/verify_runtime.py \
            --manifest gate0-candidate/runtime-manifest.json \
            --inspection gate0-candidate/pe-inspection.json \
            --directory gate0-candidate

      - name: Snapshot all corresponding source
        run: |
          task_snapshot="$RUNNER_TEMP/gate0-source-snapshot"
          mkdir -p "$task_snapshot/recipe" "$task_snapshot/upstream" \
            "$task_snapshot/toolchain-source" "$task_snapshot/cargo"
          git archive HEAD | tar -xf - -C "$task_snapshot/recipe"
          tar -C upstream \
            --exclude=mingw_build \
            --exclude=mingw_prefix \
            --exclude=artifact \
            --exclude='*/builddir' \
            -cf - . | tar -xf - -C "$task_snapshot/upstream"
          cp -a "$RUNNER_TEMP/gate0-toolchain-source/." \
            "$task_snapshot/toolchain-source/"
          task_cargo_root="${CARGO_HOME:-/home/runner/.cargo}"
          if [[ -d "$task_cargo_root/registry/src" ]]; then
            cp -a "$task_cargo_root/registry/src" "$task_snapshot/cargo/registry-src"
          fi
          if [[ -d "$task_cargo_root/git/checkouts" ]]; then
            cp -a "$task_cargo_root/git/checkouts" "$task_snapshot/cargo/git-checkouts"
          fi
          tar -czf gate0-source-snapshot.tar.gz -C "$task_snapshot" .
          test -s gate0-source-snapshot.tar.gz

      - name: Upload candidate with source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate0-windows-x64-${{ github.sha }}
          path: |
            gate0-candidate
            gate0-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 7
